    const useStickyState = (defaultValue, key) => {
      const [value, setValue] = useState(() => {
        try {
          const stickyValue = window.localStorage.getItem(key);
          return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
        } catch (err) {
          return defaultValue;
        }
      });
      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));

      return [value, setValue];

    // --- 萬用地圖連結與路線魔法 ---
    const getMapLink = (query) => `https://maps.google.com/?q=${encodeURIComponent(query)}`;
    const generateRouteMap = (spots) => {
      if (!spots || spots.length === 0) return "#";
      if (spots.length === 1) return getMapLink(spots[0].name);
      const waypoints = spots.map(s => encodeURIComponent(s.name));
      const origin = waypoints[0];
      const dest = waypoints[waypoints.length - 1];
      const mids = waypoints.slice(1, -1).join('%7C'); 
      return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}${mids ? `&waypoints=${mids}` : ''}`;
    };

    const getDriveImage = (id) => `https://lh3.googleusercontent.com/d/${id}`;

    // --- 距離與路線評估魔法 (Haversine Formula) ---
    const getDistance = (lat1, lon1, lat2, lon2) => {
      const R = 6371; // 地球半徑(公里)
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c * 1.3; // 乘以 1.3 模擬實際道路彎曲距離
    };

    const evaluateRoute = (daySpots) => {
      const validSpots = daySpots.filter(s => s.lat && s.lng);
      if (validSpots.length < 2) return null;

      let totalDist = 0;
      for (let i = 0; i < validSpots.length - 1; i++) {
        totalDist += getDistance(validSpots[i].lat, validSpots[i].lng, validSpots[i+1].lat, validSpots[i+1].lng);
      }

      // 計算最佳理論距離 (貪婪演算法) 來判斷是否繞路
      let greedyDist = 0;
      let unvisited = [...validSpots.slice(1)];
      let current = validSpots[0];
      while(unvisited.length > 0) {
        let minDist = Infinity;
        let nextIndex = -1;
        for (let i = 0; i < unvisited.length; i++) {
           let d = getDistance(current.lat, current.lng, unvisited[i].lat, unvisited[i].lng);
           if (d < minDist) { minDist = d; nextIndex = i; }
        }
        greedyDist += minDist;
        current = unvisited[nextIndex];
        unvisited.splice(nextIndex, 1);
      }

      const efficiency = totalDist / (greedyDist || 1);
      let status = "✨ 路線很順暢";
      let colorClass = "text-[#5A6B41] bg-[#E9EDC9]";
      let icon = "ph-check-circle";

      if (efficiency > 1.4 && totalDist > 20) {
         status = "🔄 稍微繞路，建議調整順序";
         colorClass = "text-[#92400E] bg-[#FFF8E7]";
         icon = "ph-warning-circle";
      } else if (totalDist > 90) {
         status = "⚠️ 總車程較長，注意保留體力";
         colorClass = "text-[#BE185D] bg-[#FFF0F5]";
         icon = "ph-car-profile";
      }

      return {
         km: totalDist.toFixed(1),
         status, colorClass, icon
      };
    };

    function App() {
      const [activeTab, setActiveTab] = useState('itinerary');
      
      // V10: 行程自由編輯狀態 (更新快取金鑰確保讀取到新行程)
      const [itinerary, setItinerary] = useStickyState(defaultItineraryData, 'ddsen-itinerary-v10-final-perfect');

      // 雲端智慧地點搜尋狀態

      const searchTimeoutRef = useRef({});

      const [activeChild, setActiveChild] = useState('jiebao');
      const [activeShopper, setActiveShopper] = useState('maomao');
      const [activePacker, setActivePacker] = useState('maomao');
      
      const [completedTasksArr, setCompletedTasksArr] = useStickyState({ jiebao: [], ningning: [] }, 'ddsen-tasks-v10-perfect');
      const [maomaoWishlist, setMaomaoWishlist] = useStickyState(defaultMaomaoWishlist, 'ddsen-wish-maomao-img-v1');
      const [leileiWishlist, setLeileiWishlist] = useStickyState(defaultLeileiWishlist, 'ddsen-wish-leilei-img-v1');
      const [newWish, setNewWish] = useState('');
      
      const [maomaoLuggage, setMaomaoLuggage] = useStickyState(defaultLuggageCategories, 'ddsen-luggage-maomao-v10-perfect');
      const [leileiLuggage, setLeileiLuggage] = useStickyState(defaultLuggageCategories, 'ddsen-luggage-leilei-v10-perfect');
      const [newLuggageInputs, setNewLuggageInputs] = useState({});
      
      const [weatherData, setWeatherData] = useState({});
      const [isWeatherSyncing, setIsWeatherSyncing] = useState(false);

      const currentChildData = missionsData[activeChild];
      const completedCount = completedTasksArr[activeChild]?.length || 0;
      const unlockedStickers = Math.min(6, Math.floor(completedCount / 5));

      // --- 氣象與降雨機率抓取魔法 ---
      const fetchWeather = async () => {
        setIsWeatherSyncing(true);
        try {
          const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=26.2124&longitude=127.6809&hourly=temperature_2m,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=14');
          const data = await res.json();
          if(data && data.hourly) {
            const newWeather = {};
            itinerary.forEach((day, idx) => {
              const dateStr = `2026-05-0${5 + idx}`;
              const mIdx = data.hourly.time.findIndex(t => t === `${dateStr}T08:00`);
              const nIdx = data.hourly.time.findIndex(t => t === `${dateStr}T13:00`);
              const eIdx = data.hourly.time.findIndex(t => t === `${dateStr}T19:00`);
              
              if(mIdx !== -1) {
                newWeather[day.day] = {
                  morning: { t: Math.round(data.hourly.temperature_2m[mIdx]), p: data.hourly.precipitation_probability[mIdx] },
                  noon: { t: Math.round(data.hourly.temperature_2m[nIdx]), p: data.hourly.precipitation_probability[nIdx] },
                  evening: { t: Math.round(data.hourly.temperature_2m[eIdx]), p: data.hourly.precipitation_probability[eIdx] }
                };
              } else {
                const isRainy = day.date.includes("5/6");
                const isSunny = day.date.includes("5/7");
                newWeather[day.day] = { 
                  morning: { t: day.baseTemp - 1, p: isRainy ? 60 : isSunny ? 10 : 30 }, 
                  noon: { t: day.baseTemp + 3, p: isRainy ? 80 : isSunny ? 10 : 40 }, 
                  evening: { t: day.baseTemp, p: isRainy ? 50 : isSunny ? 20 : 30 } 
                };
              }
            });
            setWeatherData(newWeather);
          }
        } catch (error) {
          console.error("氣象同步失敗");
        } finally {
          setTimeout(() => setIsWeatherSyncing(false), 800);
        }
      };

      useEffect(() => { fetchWeather(); }, []);

      // --- 行程編輯與拖拉魔法 ---
      const dragItem = useRef(null);
      const dragOverItem = useRef(null);

      const handleDragStart = (e, spotIdx) => { dragItem.current = spotIdx; };
      const handleDragEnter = (e, spotIdx) => { dragOverItem.current = spotIdx; };
      const handleDragEnd = (dayIdx) => {
        if (dragItem.current === null || dragOverItem.current === null) return;
        const newIt = [...itinerary];
        const daySpots = [...newIt[dayIdx].spots];
        const dragSpot = daySpots[dragItem.current];
        daySpots.splice(dragItem.current, 1);
        daySpots.splice(dragOverItem.current, 0, dragSpot);
        newIt[dayIdx].spots = daySpots;
        setItinerary(newIt);
        dragItem.current = null;
        dragOverItem.current = null;
      };

      // V11 時間防呆自動格式化 (不跑出上午下午)
      const handleSpotTimeChange = (dayIdx, spotId, val) => {
        let formatted = val.replace(/[^0-9:]/g, ''); // 只保留數字和冒號
        if (formatted.length === 2 && !formatted.includes(':') && val.length === 2) {
            formatted += ':';
        }
        if (formatted.length > 5) formatted = formatted.substring(0, 5);
        
        const newIt = [...itinerary];
        const spotIdx = newIt[dayIdx].spots.findIndex(s => s.id === spotId);
        if(spotIdx > -1) {
          newIt[dayIdx].spots[spotIdx].time = formatted;
          setItinerary(newIt);
        }
      };

      const handleSpotInputChange = (dayIdx, field, value) => {
        setNewSpots(prev => ({
          ...prev,
          [dayIdx]: { ...(prev[dayIdx] || { time: '', name: '', desc: '', lat: null, lng: null }), [field]: value }
        }));
      };

      // 雲端智慧搜尋魔法
      const handleSpotNameChange = (dayIdx, value) => {
        handleSpotInputChange(dayIdx, 'name', value);
        if (searchTimeoutRef.current[dayIdx]) clearTimeout(searchTimeoutRef.current[dayIdx]);
        if (!value.trim()) { setSuggestions(prev => ({ ...prev, [dayIdx]: [] })); return; }

        setIsSearching(prev => ({ ...prev, [dayIdx]: true }));
        searchTimeoutRef.current[dayIdx] = setTimeout(async () => {
          try {
            const searchQuery = value.includes('沖繩') || value.includes('Okinawa') || value.includes('那霸') ? value : `沖繩 ${value}`;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&countrycodes=jp,tw&limit=5&accept-language=zh-TW,zh;q=0.9`);
            const data = await res.json();
            setSuggestions(prev => ({ ...prev, [dayIdx]: data }));
          } catch (error) {
            console.error("搜尋地點失敗");
          } finally {
            setIsSearching(prev => ({ ...prev, [dayIdx]: false }));
          }
        }, 500);
      };

      const selectSuggestion = (dayIdx, s) => {
        const mainName = s.display_name.split(',')[0].trim();
        handleSpotInputChange(dayIdx, 'name', mainName);
        handleSpotInputChange(dayIdx, 'lat', parseFloat(s.lat));
        handleSpotInputChange(dayIdx, 'lng', parseFloat(s.lon));
        setSuggestions(prev => ({ ...prev, [dayIdx]: [] }));
      };
